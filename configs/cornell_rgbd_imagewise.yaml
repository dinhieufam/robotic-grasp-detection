# Primary model, Cornell, RGB-D, image-wise split (secondary).
name: cornell_rgbd_imagewise
seed: 0
data_config: configs/data_cornell.yaml

data:
  split: data/splits/cornell_imagewise.json
  channels: rgbd            # rgbd | rgb | d
  augment: true

model:                      # proposal architecture
  widths: [32, 64, 128]
  n_res: 5
  dropout: 0.0

train:
  epochs: 50
  batch_size: 16
  lr: 1.0e-3
  weight_decay: 0.0
  scheduler: none           # none | cosine
  num_workers: 6

eval:
  q_sigma: 2.0              # Gaussian smoothing of Q before arg-max
  ang_sigma: 2.0
  w_sigma: 1.0
  jaw_ratio: 0.5
  angle_thresh_deg: 30
  iou_thresh: 0.25
